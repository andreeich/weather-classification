data:
  cleaned_data: "data/cleaned_weather.csv"
  train_data: "data/train.csv"
  validation_data: "data/validation.csv"
  test_data: "data/test.csv"

model:
  parameters:
    - epochs: 50
      batch_size: 32
    - max_iter: 1000
      C: 1.0
      solver: "lbfgs"
    - max_iter: 1000
      C: 0.5
      solver: "liblinear"
    - n_estimators: 100
      learning_rate: 0.1
      max_depth: 3

report:
  file_path: "detailed_report.csv"